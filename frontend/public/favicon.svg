  <!-- Flag (warm gold) -->
  <path d="M13.5 7.5 L22.5 11.5 L13.5 15.5 Z" fill="url(#gold)"/>
  
  <!-- Hole cup -->
  <ellipse cx="13.5" cy="23.5" rx="3.2" ry="1.2" fill="#064E3B"/>
  
  <!-- Golf ball -->
  <circle cx="20.5" cy="22.5" r="2.8" fill="#FFFFFF"/>
  <circle cx="20.1" cy="22.1" r="0.5" fill="#E2E8F0"/>
  <circle cx="21.3" cy="22.7" r="0.45" fill="#E2E8F0"/>
  <circle cx="19.8" cy="23.1" r="0.4" fill="#CBD5E1"/>
